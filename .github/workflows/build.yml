name: Build Release

on:
  push:
    tags:
      - "*"

jobs:
  build-ankiaddon:
    runs-on: ubuntu-latest

    steps:
      - name: Set env
        shell: bash
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
      - name: Checkout repository
        uses: actions/checkout@v2
      - name: Create dist folder
        shell: bash
        run: |
          mkdir dist
      - name: Zip
        shell: bash
        run: |
          MIGAKU_VERSION="${RELEASE_VERSION}" python3 tools/build_ankiaddon.py --output dist/Migaku.ankiaddon
      - name: Upload artifacts
        uses: ncipollo/release-action@v1
        with:
          artifacts: "dist/*"
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}

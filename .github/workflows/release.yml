name: Release

on:
  push:
  workflow_dispatch:
    inputs:
      production_branch:
        description: Production branch override; defaults to the configured production branch
        required: false
        type: string
      development_branch:
        description: Integration branch override
        required: false
        default: develop
        type: string

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  PRODUCTION_BRANCH: ${{ inputs.production_branch || vars.PRODUCTION_BRANCH || 'main' }}
  DEVELOPMENT_BRANCH: ${{ inputs.development_branch || vars.DEVELOPMENT_BRANCH || 'develop' }}

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.ref_name == (inputs.production_branch || vars.PRODUCTION_BRANCH || 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCTION_BRANCH }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Consume pending changesets
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm run release:prepare
          release_version="$(node -p "require('./package.json').version")"
          if git diff --quiet; then
            release_tag="v$release_version"
            release_asset_name="Migaku-Anki-Addon-v${release_version}--$(date -u +%Y%m%d).ankiaddon"
            if git ls-remote --exit-code origin "refs/tags/$release_tag" >/dev/null 2>&1 \
              && ! gh release view "$release_tag" --json assets --jq '.assets[].name' 2>/dev/null | grep -Fxq "$release_asset_name"; then
              echo "has_release=true" >> "$GITHUB_OUTPUT"
            else
              echo "has_release=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          echo "has_release=true" >> "$GITHUB_OUTPUT"
          echo "has_metadata=true" >> "$GITHUB_OUTPUT"

      - name: Resolve release version
        id: version
        run: |
          release_version="$(node -p "require('./package.json').version")"
          echo "version=$release_version" >> "$GITHUB_OUTPUT"
          echo "asset_name=Migaku-Anki-Addon-v${release_version}--$(date -u +%Y%m%d).ankiaddon" >> "$GITHUB_OUTPUT"

      - name: Validate release
        if: steps.prepare.outputs.has_release == 'true'
        run: npm test

      - name: Commit release metadata
        if: steps.prepare.outputs.has_metadata == 'true'
        id: commit
        run: |
          release_version="${{ steps.version.outputs.version }}"
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .changeset CHANGELOG.md package.json package-lock.json ankiweb.html
          git commit -m "chore: release $release_version"
          git push origin "HEAD:$PRODUCTION_BRANCH"
          echo "version=$release_version" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Tag release
        if: steps.prepare.outputs.has_release == 'true'
        run: |
          release_tag="v${{ steps.version.outputs.version }}"
          if git ls-remote --exit-code origin "refs/tags/$release_tag" >/dev/null 2>&1; then
            echo "Tag $release_tag already exists"
          else
            git tag -a "$release_tag" -m "Release ${{ steps.version.outputs.version }}"
            git push origin "$release_tag"
          fi

      - name: Build release archive
        if: steps.prepare.outputs.has_release == 'true'
        run: |
          mkdir -p dist
          archive_path="dist/${{ steps.version.outputs.asset_name }}"
          MIGAKU_VERSION="${{ steps.version.outputs.version }}" \
            python3 tools/build_ankiaddon.py --output "$archive_path"
          npm run release:notes -- "${{ steps.version.outputs.version }}" > dist/release-notes.md

      - name: Publish GitHub release
        if: steps.prepare.outputs.has_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="v${{ steps.version.outputs.version }}"
          archive_path="dist/${{ steps.version.outputs.asset_name }}"
          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release upload "$release_tag" \
              "$archive_path" \
              --clobber
          else
            gh release create "$release_tag" \
              "$archive_path" \
              --title "Migaku Anki Add-on ${{ steps.version.outputs.version }}" \
              --notes-file dist/release-notes.md
          fi

      - name: Sync release metadata back to development
        if: steps.prepare.outputs.has_metadata == 'true'
        run: |
          git fetch origin "$DEVELOPMENT_BRANCH"
          git checkout -B "$DEVELOPMENT_BRANCH" "origin/$DEVELOPMENT_BRANCH"
          git merge --no-edit "${{ steps.commit.outputs.commit }}"
          git push origin "HEAD:$DEVELOPMENT_BRANCH"
